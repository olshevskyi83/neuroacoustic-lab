# NeuroAcoustic Lab — default analysis configuration (Milestone 3)

[project]
name = "neuroacoustic-lab"
analysis_version = "0.3.0"
schema_version = "0.3.0"

[paths]
input_dir = "data/input"
output_dir = "data/output"
database = "data/db/neuroacoustic.sqlite"

[logging]
level = "INFO"
json_logs = false

[audio]
supported_extensions = ["wav", "flac", "aiff", "aif", "mp3"]
soundfile_extensions = ["wav", "flac", "aiff", "aif"]
ffmpeg_extensions = ["mp3"]

# When omitted, preserve the native sample rate for analysis.
# analysis_sample_rate = 44100

silence_peak_threshold = 1.0e-6
silence_sample_threshold = 1.0e-4
clipping_threshold = 0.999
max_duration_seconds = 3600.0
min_duration_seconds = 0.01

[probe]
prefer_ffprobe = true

[analysis]
# STFT / framing (samples at the analysis sample rate)
n_fft = 2048
hop_length = 512
win_length = 2048
rolloff_percentile = 0.85
n_contrast_bands = 6
fft_peak_count = 8
max_timeseries_points = 256
fft_summary_bins = 128
amplitude_floor = 1.0e-12

# Pitch (librosa pYIN)
f0_min_hz = 65.0
f0_max_hz = 2000.0
# pYIN frame length in samples (independent of STFT n_fft when needed)
f0_frame_length = 2048
# Soft confidence warning threshold (high-confidence voicing)
voiced_prob_threshold = 0.5
# Hard floor: frames with voiced_prob below this are treated as unvoiced for aggregates
voiced_prob_floor = 0.1
# Warn when fewer voiced frames than this are available
min_voiced_frames = 3

# Harmonics
max_harmonics = 12
# Relative search half-width around n*F0 as a fraction of the *target*
# frequency n*F0 (capped below 0.45*F0 so neighbors are not merged).
# 0.10 catches resolvable detuning of ~1 bin while preserving harmonic separation.
harmonic_search_width_fraction = 0.10
# Minimum peak magnitude relative to the local fundamental peak
harmonic_rel_amp_threshold = 0.05

# Preliminary comparison-vector version (M3 appends pitch/harmonic dims)
vector_version = "0.3.0-preliminary"
