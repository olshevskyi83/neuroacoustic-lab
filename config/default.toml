# NeuroAcoustic Lab — default analysis configuration (Milestone 4A)

[project]
name = "neuroacoustic-lab"
analysis_version = "0.4.0"
schema_version = "0.4.0"

[paths]
input_dir = "data/input"
output_dir = "data/output"
database = "data/db/neuroacoustic.sqlite"

[logging]
level = "INFO"
json_logs = false

[audio]
supported_extensions = ["wav", "wave", "flac", "aiff", "aif", "mp3"]
soundfile_extensions = ["wav", "wave", "flac", "aiff", "aif"]
ffmpeg_extensions = ["mp3"]

silence_peak_threshold = 1.0e-6
silence_sample_threshold = 1.0e-4
clipping_threshold = 0.999
max_duration_seconds = 3600.0
min_duration_seconds = 0.01

[probe]
prefer_ffprobe = true

[analysis]
n_fft = 2048
hop_length = 512
win_length = 2048
rolloff_percentile = 0.85
n_contrast_bands = 6
fft_peak_count = 8
max_timeseries_points = 256
fft_summary_bins = 128
amplitude_floor = 1.0e-12

# Pitch (librosa pYIN)
f0_min_hz = 65.0
f0_max_hz = 2000.0
f0_frame_length = 2048
voiced_prob_threshold = 0.5
voiced_prob_floor = 0.1
min_voiced_frames = 3

# Harmonics
max_harmonics = 12
harmonic_search_width_fraction = 0.10
harmonic_rel_amp_threshold = 0.05

# Envelope / ADSR estimates (Milestone 4A)
envelope_smooth_frames = 5
envelope_onset_ratio = 0.1
envelope_attack_high_ratio = 0.9
envelope_sustain_start = 0.35
envelope_sustain_end = 0.75
envelope_release_ratio = 0.1

# Rhythm
min_tempo_bpm = 40.0
max_tempo_bpm = 240.0
min_onset_events_for_tempo = 4
min_duration_for_tempo_seconds = 0.5
# Evidence gate (see docs/metrics.md and rhythm.py module docstring)
min_beats_for_tempo = 3
max_beat_interval_cv = 0.35
min_tempo_periodicity = 0.30

# Reverberation / file-tail decay estimate
decay_fit_db_range = 20.0
decay_min_r2 = 0.85
decay_min_duration_seconds = 0.05

# Preliminary vector (M4A appends from index 22; 0–21 unchanged)
vector_version = "0.4.0-preliminary"
