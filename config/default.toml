# NeuroAcoustic Lab — default analysis configuration (Milestone 2)

[project]
name = "neuroacoustic-lab"
analysis_version = "0.2.0"
schema_version = "0.2.0"

[paths]
input_dir = "data/input"
output_dir = "data/output"
database = "data/db/neuroacoustic.sqlite"

[logging]
level = "INFO"
json_logs = false

[audio]
supported_extensions = ["wav", "flac", "aiff", "aif", "mp3"]
soundfile_extensions = ["wav", "flac", "aiff", "aif"]
ffmpeg_extensions = ["mp3"]

# When omitted, preserve the native sample rate for analysis.
# analysis_sample_rate = 44100

silence_peak_threshold = 1.0e-6
silence_sample_threshold = 1.0e-4
clipping_threshold = 0.999
max_duration_seconds = 3600.0
min_duration_seconds = 0.01

[probe]
prefer_ffprobe = true

[analysis]
# STFT / framing (samples at the analysis sample rate)
n_fft = 2048
hop_length = 512
win_length = 2048
# Spectral rolloff cumulative-energy fraction (0–1)
rolloff_percentile = 0.85
# Spectral contrast octave bands (librosa)
n_contrast_bands = 6
# Max magnitude peaks retained in the FFT summary
fft_peak_count = 8
# Max points retained for downsampled time-series curves in JSON
max_timeseries_points = 256
# Magnitude spectrum bins retained in FFT summary (log-spaced copy also stored)
fft_summary_bins = 128
# Floor (linear amplitude) used when converting ratios to dB to avoid log(0)
amplitude_floor = 1.0e-12
# Preliminary comparison-vector version label
vector_version = "0.2.0-preliminary"
