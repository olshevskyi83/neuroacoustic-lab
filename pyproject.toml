[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroacoustic"
version = "0.3.0"
description = "Local-first research platform for physical acoustic analysis of sound"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NeuroAcoustic Lab" }]
keywords = ["audio", "acoustics", "fingerprint", "signal-processing"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "matplotlib>=3.8",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
neuroacoustic = "neuroacoustic.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuroacoustic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
